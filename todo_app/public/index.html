<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #333; text-align: center; }
    img { width: 220px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
    form { display: flex; gap: .5rem; justify-content: center; margin: 2rem 0 1rem; }
    input { flex: 1; max-width: 400px; padding: .6rem; border: 2px solid #4caf50; border-radius: 4px; font-size: 1rem; }
    button { padding: .6rem 1.4rem; background: #4caf50; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    ul { list-style: none; padding: 0; text-align: left; }
    li { background: #f7f7f7; border-left: 4px solid #4caf50; margin: .5rem 0; padding: .8rem 1rem; border-radius: 4px; }
    .counter { font-size: .8rem; color: #777; }
    footer { margin-top: 2rem; color: #777; }
  </style>
</head>
<body>
  <h1>Todo App</h1>
  <img src="/image" alt="Random image from Lorem Picsum">

  <form id="todo-form">
    <input id="todo-input" type="text" maxlength="140"
           placeholder="Enter a new todo (max 140 characters)" required>
    <button type="submit">Send</button>
  </form>
  <div class="counter"><span id="char-count">0</span>/140</div>

  <h2>Todos</h2>
  <ul id="todo-list">
    <li>Learn Kubernetes basics</li>
    <li>Deploy application to cluster</li>
    <li>Configure persistent volumes</li>
  </ul>

  <footer>DevOps with Kubernetes 2026</footer>

  <script>
    const input = document.getElementById('todo-input');
    const charCount = document.getElementById('char-count');

    input.addEventListener('input', () => {
      charCount.textContent = input.value.length;
    });

    // Por ahora el botón no envía nada (se implementa en ejercicios siguientes)
    document.getElementById('todo-form').addEventListener('submit', (e) => {
      e.preventDefault();
    });
  </script>
</body>
</html>
