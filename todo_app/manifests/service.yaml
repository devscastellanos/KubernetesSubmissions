apiVersion: v1
kind: Service
metadata:
  name: todo-app-svc
spec:
  type: NodePort
  selector:
    app: todo-app # debe coincidir con el label del deployment
  ports:
    - name: http
      protocol: TCP
      port: 1234 # puerto del Service dentro del clúster
      targetPort: 3000 # puerto donde escucha el contenedor (PORT)
      nodePort: 30080 # puerto en los nodos, mapeado a localhost:8082
